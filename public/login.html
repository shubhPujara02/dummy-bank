<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dummy Bank - Log In</title>
  <!--#head-->
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a class="logo" href="/"><span class="logo-mark">D</span>DUMMY BANK</a>
      <div class="nav-links">
        <a href="/#products">Products</a>
        <a href="/#callback">Talk to us</a>
        <a href="/leads.html">Leads (test)</a>
      </div>
      <div class="nav-cta">
        <a class="btn btn-outline" href="/login.html">Log in</a>
        <a class="btn btn-gold" href="/open-account.html">Open account</a>
      </div>
    </nav>
  </header>

  <main class="narrow" style="max-width:440px">
    <div class="card">
      <h1>Welcome Back</h1>
      <p class="subtitle">Log in with your registered mobile number.</p>

      <form id="login-form">
        <div class="field">
          <label for="mobile">Mobile Number</label>
          <input id="mobile" name="mobile" type="tel" placeholder="10-digit mobile number" maxlength="10" required />
        </div>
        <button class="btn-block" type="submit" id="submit-btn">Log In</button>
      </form>

      <div id="message" class="message"></div>
    </div>
    <p class="footer-link">New here? <a href="/open-account.html">Create an account</a></p>
  </main>

  <script src="/js/app.js"></script>
  <script>
    const form = document.getElementById('login-form');
    const messageEl = document.getElementById('message');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      messageEl.className = 'message';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Logging in...';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mobile: document.getElementById('mobile').value.trim() }),
        });
        const data = await res.json();
        if (!res.ok) {
          DummyBank.showMessage(messageEl, 'error', DummyBank.escapeHtml(data.error || 'Something went wrong.'));
        } else {
          sessionStorage.setItem('db_account', JSON.stringify(data.account));
          location.href = '/dashboard.html';
        }
      } catch (err) {
        DummyBank.showMessage(messageEl, 'error', 'Could not reach the server.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Log In';
      }
    });
  </script>
</body>
</html>
