<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dummy Bank - Open an Account</title>
  <script src="https://consent.dev.iqworks.ai/v1/blocker.js"
    data-consentiq-key="1a4bca7c-6113-41ac-a49e-d534295a0d34"
    data-consentiq-autoblock="0"
    data-consentiq-api="https://consent.dev.iqworks.ai"></script>
  <script>
    // Dummy tracker cookies, purely so ConsentIQ's Cookie Scanner / banner
    // have real cookies on the page to detect for this demo.
    const oneYear = 60 * 60 * 24 * 365;
    document.cookie = `_dummy_ga=GA1.2.${Math.floor(Math.random() * 1e9)}; path=/; max-age=${oneYear}`;
    document.cookie = `_dummy_marketing_id=mkt-${Math.floor(Math.random() * 1e6)}; path=/; max-age=${oneYear}`;
    document.cookie = `_dummy_session_pref=theme-light; path=/; max-age=${60 * 60 * 24 * 30}`;
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header><div class="logo">DUMMY BANK</div></header>
  <main>
    <div class="card">
      <h1>Let's Get Started</h1>
      <p class="subtitle">Create your account to continue.</p>

      <form id="signup-form">
        <div class="field">
          <label for="name">Full Name</label>
          <input id="name" name="name" type="text" placeholder="Enter your full name" required />
        </div>
        <div class="field">
          <label for="mobile">Mobile Number</label>
          <input id="mobile" name="mobile" type="tel" placeholder="10-digit mobile number" maxlength="10" required />
        </div>
        <div class="field">
          <label for="email">Email ID</label>
          <input id="email" name="email" type="email" placeholder="Enter your email" required />
        </div>
        <button type="submit" id="submit-btn">Create Account</button>
      </form>

      <div id="message" class="message"></div>
      <a href="https://consent.dev.iqworks.ai/portal/consent/368ba711-d615-4cd6-b9b2-178066f83474">Give consent</a>
    </div>
    <p class="footer-link">Already have an account? <a href="login.html">Log in</a></p>
  </main>

  <script>
    const form = document.getElementById('signup-form');
    const messageEl = document.getElementById('message');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      messageEl.className = 'message';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating...';

      const payload = {
        name: document.getElementById('name').value.trim(),
        mobile: document.getElementById('mobile').value.trim(),
        email: document.getElementById('email').value.trim(),
      };

      try {
        const res = await fetch('/api/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json();

        if (!res.ok) {
          messageEl.className = 'message error';
          messageEl.textContent = data.error || 'Something went wrong.';
        } else {
          messageEl.className = 'message success';
          messageEl.textContent = `Account created for ${data.account.name}. You can now log in.`;
          form.reset();
        }
      } catch (err) {
        messageEl.className = 'message error';
        messageEl.textContent = 'Could not reach the server.';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
